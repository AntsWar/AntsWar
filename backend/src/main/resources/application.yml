spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/app
    username: admin
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never

server:
  forward-headers-strategy: framework
  servlet:
    context-path: /api