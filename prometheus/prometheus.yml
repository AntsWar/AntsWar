global:
  # 메모리 부족으로 인해 1분으로 놓음
  scrape_interval: 60s
  evaluation_interval: 60s

# docker 내부 경로
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "backend"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9091"]

  - job_name: "mysql"
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
