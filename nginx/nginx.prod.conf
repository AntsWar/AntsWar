# nginx의 기본 이벤트 설정
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # backend 컨테이너를 upstream 이름으로 등록
    # nginx 내부에서 http://backend 로 접근 가능하게 함
    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name anstwar.site www.anstwar.site;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://anstwar.site$request_uri;
    }

    server {
        listen 443 ssl ;
        server_name www.anstwar.site;

        ssl_certificate /etc/letsencrypt/live/anstwar.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/anstwar.site/privkey.pem;

        return 301 https://anstwar.site$request_uri;
    }

    server {
        listen 443 ssl ;
        server_name anstwar.site;

        ssl_certificate /etc/letsencrypt/live/anstwar.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/anstwar.site/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;

            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}